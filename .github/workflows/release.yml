name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Builds the archives without publishing, so packaging changes can be tested before a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Static musl builds run on any Linux, unlike the gnu build, which needs the
          # runner's glibc (2.34+) or newer.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          staging="octet-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging/man" "$staging/completions"
          cp "target/${{ matrix.target }}/release/octet" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$staging/"
          cargo run --release -- --man > "$staging/man/octet.1"
          cargo run --release -- --completions bash > "$staging/completions/octet.bash"
          cargo run --release -- --completions zsh > "$staging/completions/_octet"
          cargo run --release -- --completions fish > "$staging/completions/octet.fish"
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            octet-*.tar.gz
            octet-*.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/octet-*.tar.gz
            artifacts/octet-*.tar.gz.sha256
