[package]
name = "octet-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["The Octet Authors"]
description = "Information-design-first hex viewer, binary inspector, and modern xxd / hexdump replacement."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/oddurs/octet"
homepage = "https://github.com/oddurs/octet"
documentation = "https://docs.rs/octet-cli"
keywords = ["hex", "hexdump", "xxd", "binary", "inspector"]
categories = [
    "command-line-utilities",
    "development-tools::debugging",
    "encoding",
    "parser-implementations",
]
exclude = [
    "docs/screenshots/*",
    ".github/*",
    ".githooks/*",
    ".editorconfig",
    ".gitattributes",
]

[lib]
name = "octet"
path = "src/lib.rs"

[[bin]]
name = "octet"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "allow"
