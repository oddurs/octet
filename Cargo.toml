[package]
name = "octet"
version = "0.1.0"
edition = "2024"
description = "Information-design-first hex viewer, binary inspector, and xxd/hexdump alternative."
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "octet"
path = "src/lib.rs"

[[bin]]
name = "octet"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "allow"
